name: Build NEON DROID for Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build installer and portable app
        run: npm run dist
      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: NEON-DROID-Windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
